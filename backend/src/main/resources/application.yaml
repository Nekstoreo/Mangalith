spring:
  application:
    name: mangalith-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/mangalith_db
    username: mangalith_user
    password: mangalith_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
  
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.mangalith: DEBUG
